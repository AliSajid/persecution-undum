#:schema https://mise.jdx.dev/schema/mise.json
[tools]
biome = "2.6.4"
cspell = "10.4.0"
"github:itchio/butler" = { version = "15.32.0", postinstall = 'chmod +x ${MISE_TOOL_INSTALL_PATH}/butler' }
gitleaks = "8.30.1"
hk = { version = "2.10.0", workflow = "release.yml" }
markdownlint-cli2 = "0.24.0"
python = "3.14.10"

[env]
ITCH_TARGET = "banseljaj/persecution:html5"

[tasks.serve]
description = "Serve the games directory using a minimal web server for local preview"
run = "python -m http.server 8000 --bind 127.0.0.1 --directory dist/itch"
depends = "build"

[tasks.lint]
description = "Check every file"
run = "hk check --all"

[tasks.fix]
description = "Check and auto-fix every file"
run = "hk fix --all"
